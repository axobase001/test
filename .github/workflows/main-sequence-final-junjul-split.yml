name: main-sequence-final-junjul-split

on:
  pull_request:
    branches: [ main-sequence-dual-exit-93d-20260815 ]
    paths:
      - '.github/workflows/main-sequence-final-junjul-split.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: jun_a
            start: '2026-06-01'
            end: '2026-06-16'
          - shard: jun_b
            start: '2026-06-16'
            end: '2026-07-01'
          - shard: jul_a
            start: '2026-07-01'
            end: '2026-07-16'
          - shard: jul_b
            start: '2026-07-16'
            end: '2026-08-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Score frozen causal shard
        run: |
          python main_sequence/final_recent_replay.py score \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --shard '${{ matrix.shard }}' \
            --out 'split_${{ matrix.shard }}' \
            --workers 10
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-final-split-${{ matrix.shard }}
          path: |
            split_${{ matrix.shard }}/dual_exit_records.csv
            split_${{ matrix.shard }}/market_inventory.csv
            split_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14
