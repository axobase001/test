name: main-sequence-final-oldtail-split

on:
  pull_request:
    branches: [ main-sequence-dual-exit-93d-20260815 ]
    paths:
      - '.github/workflows/main-sequence-final-oldtail-split.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: nov_a
            start: '2025-11-01'
            end: '2025-11-15'
          - shard: nov_b
            start: '2025-11-15'
            end: '2025-12-01'
          - shard: dec_a
            start: '2025-12-01'
            end: '2025-12-16'
          - shard: dec_b
            start: '2025-12-16'
            end: '2026-01-01'
          - shard: jan_a
            start: '2026-01-01'
            end: '2026-01-16'
          - shard: jan_b
            start: '2026-01-16'
            end: '2026-02-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Score frozen causal shard at low concurrency
        run: |
          python main_sequence/final_recent_replay.py score \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --shard '${{ matrix.shard }}' \
            --out 'old_${{ matrix.shard }}' \
            --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-final-old-${{ matrix.shard }}
          path: |
            old_${{ matrix.shard }}/dual_exit_records.csv
            old_${{ matrix.shard }}/market_inventory.csv
            old_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14
