name: main-sequence-v5-hourly-state-batched-missing

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - '.github/workflows/main-sequence-v5-hourly-state-batched-missing.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: validate_may, start: "2026-05-01", end: "2026-06-01" }
          - { shard: jan_2026, start: "2026-01-01", end: "2026-02-01" }
          - { shard: feb_2026, start: "2026-02-01", end: "2026-03-01" }
          - { shard: mar_2026, start: "2026-03-01", end: "2026-04-01" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_hourly_state_batched.py main_sequence/v5_hourly_symmetric_stop.py main_sequence/v4_hourly_core_tail.py
      - name: Build batched causal state shard
        run: python main_sequence/v5_hourly_state_batched.py --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out 'state_${{ matrix.shard }}' --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-hourly-state-batched-${{ matrix.shard }}
          path: |
            state_${{ matrix.shard }}/state_rows.csv
            state_${{ matrix.shard }}/inventory.csv
            state_${{ matrix.shard }}/summary.json
            state_${{ matrix.shard }}/failures.json
          if-no-files-found: warn
          retention-days: 14
