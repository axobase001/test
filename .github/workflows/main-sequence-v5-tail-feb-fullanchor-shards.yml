name: main-sequence-v5-tail-feb-fullanchor-shards

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - '.github/workflows/main-sequence-v5-tail-feb-fullanchor-shards.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_tail_fullanchor_shard.py main_sequence/v5_tail_only_fast.py main_sequence/v5_hourly_symmetric_stop.py main_sequence/v4_hourly_core_tail.py main_sequence/final_recent_replay.py pm_structural/recalc.py
      - name: Score February with full-month anchors
        run: python main_sequence/v5_tail_fullanchor_shard.py --start '2026-02-01' --end '2026-03-01' --shard '${{ matrix.shard }}' --nshards 8 --out 'feb_shard_${{ matrix.shard }}' --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-tail-feb-fullanchor-${{ matrix.shard }}
          path: |
            feb_shard_${{ matrix.shard }}/tail_candidates.csv
            feb_shard_${{ matrix.shard }}/inventory.csv
            feb_shard_${{ matrix.shard }}/summary.json
            feb_shard_${{ matrix.shard }}/retry_history.json
            feb_shard_${{ matrix.shard }}/failures.json
          if-no-files-found: warn
          retention-days: 14
