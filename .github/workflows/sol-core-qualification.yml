name: sol-core-qualification

on:
  pull_request:
    branches: [sol-first-tier-core-20260818]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-core-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  sol15m_core:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax gate
        run: python -m py_compile main_sequence/sol_core_common.py main_sequence/sol15m_core_audited.py
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: SOL 15m CORE frozen qualification
        run: python main_sequence/sol15m_core_audited.py --start 2026-05-15 --end 2026-08-15 --out sol15m_out --workers 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-first-tier-15m-core
          path: |
            sol15m_out/summary.json
            sol15m_out/trades.csv
            sol15m_out/inventory.csv
            sol15m_out/daily_density.csv
          if-no-files-found: warn
          retention-days: 7

  sol1h_core:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax gate
        run: python -m py_compile main_sequence/sol_core_common.py main_sequence/sol1h_core_audited.py
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: SOL 1h CORE frozen qualification
        run: python main_sequence/sol1h_core_audited.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-first-tier-1h-core
          path: |
            eth1h_strict3_out/summary.json
            eth1h_strict3_out/events.csv
            eth1h_strict3_out/inventory.csv
            eth1h_strict3_out/market_summary.csv
          if-no-files-found: warn
          retention-days: 7
