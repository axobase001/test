name: main-sequence-b-missing-audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/prejuly_5m_missing_market_probe.py'
      - '.github/workflows/main-sequence-b-missing-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  june-missing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests only
        run: python -m pip install requests
      - name: Syntax
        run: python -m py_compile main_sequence/prejuly_5m_missing_market_probe.py
      - name: Audit theoretical June 5m listings against Gamma
        run: python main_sequence/prejuly_5m_missing_market_probe.py
