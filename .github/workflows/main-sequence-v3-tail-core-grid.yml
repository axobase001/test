name: main-sequence-v3-tail-core-grid

on:
  push:
    branches:
      - main-sequence-v3-tail-core-grid-20260816

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  grid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: may15_18, start: "2026-05-15", end: "2026-05-18" }
          - { shard: jun01_04, start: "2026-06-01", end: "2026-06-04" }
          - { shard: jun15_18, start: "2026-06-15", end: "2026-06-18" }
          - { shard: jul01_04, start: "2026-07-01", end: "2026-07-04" }
          - { shard: jul15_18, start: "2026-07-15", end: "2026-07-18" }
          - { shard: aug01_04, start: "2026-08-01", end: "2026-08-04" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/final_v3_tail_core_no_lookahead.py
      - name: Score frozen no-lookahead grid slice
        run: |
          python main_sequence/final_v3_tail_core_no_lookahead.py score \
            --start '${{ matrix.start }}' --end '${{ matrix.end }}' \
            --shard '${{ matrix.shard }}' --out 'grid_${{ matrix.shard }}' --workers 4
      - name: Show summary
        if: always()
        run: test ! -f 'grid_${{ matrix.shard }}/summary.json' || cat 'grid_${{ matrix.shard }}/summary.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v3-tail-core-grid-${{ matrix.shard }}
          path: |
            grid_${{ matrix.shard }}/dual_exit_records.csv
            grid_${{ matrix.shard }}/market_inventory.csv
            grid_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14
