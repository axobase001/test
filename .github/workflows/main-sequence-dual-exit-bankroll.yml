name: main-sequence-dual-exit-bankroll

on:
  pull_request:
    paths:
      - 'main_sequence/dual_exit_capacity_bankroll.py'
      - '.github/workflows/main-sequence-dual-exit-bankroll.yml'
  workflow_dispatch:

jobs:
  replay-bankroll:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install pandas numpy
      - name: Download authoritative corrected dual-exit shards
        run: |
          mkdir -p dual_shards
          for n in mar apr may jun1; do
            gh run download 31885683821 -n "main-sequence-dual-exit-v2-${n}" -D "dual_shards/${n}"
          done
          find dual_shards -name dual_exit_records.csv -print
      - name: Capacity-capped realized compounding replay
        run: |
          python main_sequence/dual_exit_capacity_bankroll.py --root dual_shards --out bankroll_out
      - name: Show result
        run: cat bankroll_out/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-dual-exit-capacity-bankroll
          path: bankroll_out/
          retention-days: 14
