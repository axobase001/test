name: sol-data-probe

on:
  push:
    branches: [sol-first-tier-core-run2-20260818]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Probe SOL sources
        run: python main_sequence/sol_data_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-data-probe
          path: sol_probe.json
          if-no-files-found: warn
          retention-days: 3
