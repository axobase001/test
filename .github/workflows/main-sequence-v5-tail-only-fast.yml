name: main-sequence-v5-tail-only-fast

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - 'main_sequence/v5_tail_only_fast.py'
      - '.github/workflows/main-sequence-v5-tail-only-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { shard: aug15_2025, start: "2025-08-15", end: "2025-09-01" }
          - { shard: sep_2025, start: "2025-09-01", end: "2025-10-01" }
          - { shard: oct_2025, start: "2025-10-01", end: "2025-11-01" }
          - { shard: nov_2025, start: "2025-11-01", end: "2025-12-01" }
          - { shard: dec_2025, start: "2025-12-01", end: "2026-01-01" }
          - { shard: jan_2026, start: "2026-01-01", end: "2026-02-01" }
          - { shard: feb_2026, start: "2026-02-01", end: "2026-03-01" }
          - { shard: mar_2026, start: "2026-03-01", end: "2026-04-01" }
          - { shard: apr_2026, start: "2026-04-01", end: "2026-05-01" }
          - { shard: may_2026, start: "2026-05-01", end: "2026-06-01" }
          - { shard: jun_2026, start: "2026-06-01", end: "2026-07-01" }
          - { shard: jul_2026, start: "2026-07-01", end: "2026-08-01" }
          - { shard: aug_2026, start: "2026-08-01", end: "2026-08-15" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_tail_only_fast.py main_sequence/v5_hourly_symmetric_stop.py main_sequence/v4_hourly_core_tail.py main_sequence/final_recent_replay.py pm_structural/recalc.py
      - name: Score frozen TAIL candidates
        run: python main_sequence/v5_tail_only_fast.py score --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out 'tail_${{ matrix.shard }}' --workers 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-tail-${{ matrix.shard }}
          path: |
            tail_${{ matrix.shard }}/tail_candidates.csv
            tail_${{ matrix.shard }}/inventory.csv
            tail_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: score
    if: always() && needs.score.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: main-sequence-v5-tail-*
          path: tail_states
      - name: Aggregate independent TAIL-only bankrolls
        run: python main_sequence/v5_tail_only_fast.py aggregate --root tail_states --out tail_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v5-tail-only-3m-6m-9m-12m
          path: tail_aggregate/
          retention-days: 14
