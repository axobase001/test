name: sol-core-slices

on:
  pull_request:
    branches: [sol-slice-base-20260818]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sol15m_slices:
    strategy:
      fail-fast: false
      matrix:
        include:
          - segment: m1
            start: '2026-05-15'
            end: '2026-06-15'
          - segment: m2
            start: '2026-06-15'
            end: '2026-07-15'
          - segment: m3
            start: '2026-07-15'
            end: '2026-08-15'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Run SOL 15m slice
        run: python main_sequence/sol15m_core_audited.py --start ${{ matrix.start }} --end ${{ matrix.end }} --out sol15m_out --workers 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol15m-${{ matrix.segment }}
          path: |
            sol15m_out/summary.json
            sol15m_out/trades.csv
            sol15m_out/inventory.csv
          if-no-files-found: warn
          retention-days: 7

  sol1h_slices:
    strategy:
      fail-fast: false
      matrix:
        include:
          - segment: m1
            start: '2026-05-15'
            end: '2026-06-15'
          - segment: m2
            start: '2026-06-15'
            end: '2026-07-15'
          - segment: m3
            start: '2026-07-15'
            end: '2026-08-15'
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Run SOL 1h slice
        run: python main_sequence/sol1h_slice.py --start ${{ matrix.start }} --end ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol1h-${{ matrix.segment }}
          path: |
            eth1h_strict3_out/summary.json
            eth1h_strict3_out/events.csv
            eth1h_strict3_out/inventory.csv
          if-no-files-found: warn
          retention-days: 7
