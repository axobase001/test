name: main-sequence-v4-hourly-v2-win-smoke
on:
  push:
    branches: [main-sequence-v4-hourly-v2-win-smoke-20260816]
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "honest-backtest[parquet]==0.2.0" requests scipy pandas pyarrow numpy
      - run: python -m py_compile main_sequence/v4_hourly_core_tail_v2.py
      - run: python main_sequence/v4_hourly_core_tail_v2.py score --start 2026-08-01 --end 2026-08-02 --out hourly_smoke_v2 --workers 6
      - shell: python
        run: |
          import pandas as pd, json
          d=pd.read_csv('hourly_smoke_v2/market_ticket_results.csv')
          z=d[d.ticket==5.0]
          s={'markets':int(z.start.nunique()),'pnl':float(z.pnl.sum()),'turnover':float(z.turnover.sum()),'core_entries':int(z.core_entries.sum()),'core_round_trips':int(z.core_round_trips.sum()),'tail_entries':int(z.tail_entries.sum()),'markets_with_core':int((z.core_entries>0).sum()),'markets_with_tail':int((z.tail_entries>0).sum())}
          print('SMOKE_RESULT',json.dumps(s,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v4-hourly-v2-win-smoke
          path: hourly_smoke_v2/
          retention-days: 14
