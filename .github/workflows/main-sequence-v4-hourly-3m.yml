name: main-sequence-v4-hourly-3m

on:
  push:
    branches: [main-sequence-v4-immediate-fill-1h-20260816]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v4_hourly_core_tail.py main_sequence/final_recent_replay.py pm_structural/recalc.py
      - name: Freeze protocol
        run: python main_sequence/v4_hourly_core_tail.py protocol --out frozen_v4_hourly
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v4-hourly-protocol
          path: frozen_v4_hourly/FROZEN_V4_1H_PROTOCOL.json
          retention-days: 14

  score:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: may_b, start: "2026-05-15", end: "2026-06-01" }
          - { shard: jun, start: "2026-06-01", end: "2026-07-01" }
          - { shard: jul, start: "2026-07-01", end: "2026-08-01" }
          - { shard: aug_a, start: "2026-08-01", end: "2026-08-15" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Score frozen hourly shard
        run: python main_sequence/v4_hourly_core_tail.py score --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out 'hourly_${{ matrix.shard }}' --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v4-hourly-${{ matrix.shard }}
          path: |
            hourly_${{ matrix.shard }}/market_ticket_results.csv
            hourly_${{ matrix.shard }}/inventory.csv
            hourly_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: score
    if: always() && needs.score.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: main-sequence-v4-hourly-*
          path: hourly_shards
      - name: Aggregate recent 3m
        run: python main_sequence/v4_hourly_core_tail.py aggregate --root hourly_shards --out hourly_3m --start 2026-05-15 --end 2026-08-15
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v4-hourly-3m-aggregate
          path: hourly_3m/
          retention-days: 14
