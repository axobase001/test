name: main-sequence-original-93d-source-audit

on:
  pull_request:
    branches: [ main-sequence-long-replay-20260815, main ]
    paths:
      - 'main_sequence/original_93d_source_audit.py'
      - '.github/workflows/main-sequence-original-93d-source-audit.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub hf_xet pyarrow fsspec requests
      - name: Audit candidate 93-day BTC15m sources without opening outcomes for strategy selection
        run: python main_sequence/original_93d_source_audit.py
      - name: Show audit
        if: always()
        run: |
          if [ -f original_93d_source_audit/audit.json ]; then cat original_93d_source_audit/audit.json; fi
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-original-93d-source-audit
          path: original_93d_source_audit/
          if-no-files-found: warn
          retention-days: 14
