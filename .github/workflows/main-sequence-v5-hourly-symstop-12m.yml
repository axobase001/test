name: main-sequence-v5-hourly-symstop-12m

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_hourly_symmetric_stop.py main_sequence/v4_hourly_core_tail.py main_sequence/final_recent_replay.py pm_structural/recalc.py
      - name: Freeze protocol
        run: python main_sequence/v5_hourly_symmetric_stop.py protocol --out frozen_v5
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v5-hourly-protocol
          path: frozen_v5/FROZEN_V5_PROTOCOL.json
          retention-days: 14

  score:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { shard: aug15_2025, start: "2025-08-15", end: "2025-09-01" }
          - { shard: sep_2025, start: "2025-09-01", end: "2025-10-01" }
          - { shard: oct_2025, start: "2025-10-01", end: "2025-11-01" }
          - { shard: nov_2025, start: "2025-11-01", end: "2025-12-01" }
          - { shard: dec_2025, start: "2025-12-01", end: "2026-01-01" }
          - { shard: jan_2026, start: "2026-01-01", end: "2026-02-01" }
          - { shard: feb_2026, start: "2026-02-01", end: "2026-03-01" }
          - { shard: mar_2026, start: "2026-03-01", end: "2026-04-01" }
          - { shard: apr_2026, start: "2026-04-01", end: "2026-05-01" }
          - { shard: may_2026, start: "2026-05-01", end: "2026-06-01" }
          - { shard: jun_2026, start: "2026-06-01", end: "2026-07-01" }
          - { shard: jul_2026, start: "2026-07-01", end: "2026-08-01" }
          - { shard: aug_2026, start: "2026-08-01", end: "2026-08-15" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Build causal state shard
        run: python main_sequence/v5_hourly_symmetric_stop.py score --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out 'v5_${{ matrix.shard }}' --workers 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-state-${{ matrix.shard }}
          path: |
            v5_${{ matrix.shard }}/state_rows.csv
            v5_${{ matrix.shard }}/inventory.csv
            v5_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: score
    if: always() && needs.score.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: main-sequence-v5-state-*
          path: v5_states
      - name: Aggregate 3m 6m 9m 12m bankroll windows
        run: python main_sequence/v5_hourly_symmetric_stop.py aggregate --root v5_states --out v5_aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v5-hourly-3m-6m-9m-12m-aggregate
          path: v5_aggregate/
          retention-days: 14
