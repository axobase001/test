name: main-sequence-external-inventory

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/external_inventory.py'
      - 'main_sequence/external_inventory2.py'
      - 'main_sequence/external_vinayak_v1.py'
      - '.github/workflows/main-sequence-external-inventory.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory stack
        run: python -m pip install huggingface_hub pandas pyarrow
      - name: Inventory external sources
        run: |
          python main_sequence/external_inventory.py
          python main_sequence/external_inventory2.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-external-inventory
          path: |
            external_inventory/
            external_inventory2/
          retention-days: 7

  frozen-v1-external-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen replay stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Clone independent BTC15m collector
        run: git clone --depth 1 https://github.com/Vinayak19112003/Polymarket-orderbooks.git vinayak
      - name: Download frozen Main Sequence v1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_v1
          gh run download 31786389773 -n main-sequence-v1-results -D frozen_v1
          test -f frozen_v1/main_sequence_v1.pt
          test -f frozen_v1/scaler.npz
          ls -lh frozen_v1/main_sequence_v1.pt frozen_v1/scaler.npz
      - name: Run full independent external OOD
        run: |
          PYTHONPATH=. python main_sequence/external_vinayak_v1.py \
            --csv-dir vinayak/csv_data \
            --model-dir frozen_v1 \
            --out external_v1_full \
            --cache external_v1_cache \
            --start 2026-03-24 \
            --end 2026-04-26
      - name: Show external result
        if: always()
        run: |
          if [ -f external_v1_full/SUMMARY.md ]; then cat external_v1_full/SUMMARY.md; fi
          if [ -f external_v1_full/summary.json ]; then python -m json.tool external_v1_full/summary.json; fi
      - name: Upload external full
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v1-external-full
          path: external_v1_full/
          if-no-files-found: warn
          retention-days: 7
