name: main-sequence-external-inventory

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/external_inventory.py'
      - '.github/workflows/main-sequence-external-inventory.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory stack
        run: python -m pip install huggingface_hub pandas pyarrow
      - name: Inventory external sources
        run: python main_sequence/external_inventory.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-external-inventory
          path: external_inventory/
          retention-days: 7
