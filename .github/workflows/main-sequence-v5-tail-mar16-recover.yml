name: main-sequence-v5-tail-mar16-recover

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - '.github/workflows/main-sequence-v5-tail-mar16-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_tail_only_batched.py main_sequence/v5_tail_only_fast.py main_sequence/v5_hourly_symmetric_stop.py main_sequence/v4_hourly_core_tail.py main_sequence/final_recent_replay.py pm_structural/recalc.py
      - name: Recover Mar16-24 TAIL candidates
        run: python main_sequence/v5_tail_only_batched.py score --start '2026-03-16' --end '2026-03-24' --out tail_mar16_24 --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-tail-mar16-recovered
          path: |
            tail_mar16_24/tail_candidates.csv
            tail_mar16_24/inventory.csv
            tail_mar16_24/summary.json
            tail_mar16_24/failures.json
          if-no-files-found: warn
          retention-days: 14
