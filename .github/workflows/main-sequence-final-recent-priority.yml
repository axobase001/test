name: main-sequence-final-recent-priority

on:
  pull_request:
    branches: [ main-sequence-dual-exit-93d-20260815 ]
    paths:
      - '.github/workflows/main-sequence-final-recent-priority.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'

jobs:
  latest-3m:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: may15_2026, start: '2026-05-15', end: '2026-06-01' }
          - { shard: jun_2026, start: '2026-06-01', end: '2026-07-01' }
          - { shard: jul_2026, start: '2026-07-01', end: '2026-08-01' }
          - { shard: aug14_2026, start: '2026-08-01', end: '2026-08-15' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Score frozen causal shard
        run: |
          python main_sequence/final_recent_replay.py score \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --shard '${{ matrix.shard }}' \
            --out 'priority_${{ matrix.shard }}' \
            --workers 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-final-priority-${{ matrix.shard }}
          path: |
            priority_${{ matrix.shard }}/dual_exit_records.csv
            priority_${{ matrix.shard }}/market_inventory.csv
            priority_${{ matrix.shard }}/summary.json
          if-no-files-found: warn
          retention-days: 14

  aggregate-latest-3m:
    needs: latest-3m
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: main-sequence-final-priority-*
          path: priority_shards
      - name: Aggregate and print latest 3m
        run: |
          python main_sequence/final_recent_replay.py aggregate --root priority_shards --out priority_aggregate
          python - <<'PY'
          import json
          x=json.load(open('priority_aggregate/summary.json'))
          print(json.dumps(x['windows']['3m'], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-final-priority-3m-aggregate
          path: priority_aggregate/
          retention-days: 14
