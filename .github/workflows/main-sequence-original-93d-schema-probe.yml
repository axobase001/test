name: main-sequence-original-93d-schema-probe

on:
  pull_request:
    branches: [ main-sequence-long-replay-20260815, main ]
    paths:
      - 'main_sequence/original_93d_schema_probe.py'
      - '.github/workflows/main-sequence-original-93d-schema-probe.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install --upgrade huggingface_hub hf_xet pandas pyarrow
      - name: Probe source schemas and exact daily inventory
        run: python main_sequence/original_93d_schema_probe.py
      - name: Show probe
        if: always()
        run: test ! -f original_93d_schema_probe/probe.json || cat original_93d_schema_probe/probe.json
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-original-93d-schema-probe
          path: original_93d_schema_probe/
          if-no-files-found: warn
          retention-days: 14
