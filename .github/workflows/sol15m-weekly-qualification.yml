name: sol15m-weekly-qualification

on:
  pull_request:
    branches: [sol15m-weekly-base-20260818]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol15m-weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  segment:
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { tag: w01, start: "2026-05-15", end: "2026-05-22" }
          - { tag: w02, start: "2026-05-22", end: "2026-05-29" }
          - { tag: w03, start: "2026-05-29", end: "2026-06-05" }
          - { tag: w04, start: "2026-06-05", end: "2026-06-12" }
          - { tag: w05, start: "2026-06-12", end: "2026-06-19" }
          - { tag: w06, start: "2026-06-19", end: "2026-06-26" }
          - { tag: w07, start: "2026-06-26", end: "2026-07-03" }
          - { tag: w08, start: "2026-07-03", end: "2026-07-10" }
          - { tag: w09, start: "2026-07-10", end: "2026-07-17" }
          - { tag: w10, start: "2026-07-17", end: "2026-07-24" }
          - { tag: w11, start: "2026-07-24", end: "2026-07-31" }
          - { tag: w12, start: "2026-07-31", end: "2026-08-07" }
          - { tag: w13, start: "2026-08-07", end: "2026-08-14" }
          - { tag: w14, start: "2026-08-14", end: "2026-08-15" }
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax gate
        run: python -m py_compile main_sequence/sol_core_common.py main_sequence/sol15m_core_audited.py
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Run frozen SOL 15m weekly segment
        run: python main_sequence/sol15m_core_audited.py --start ${{ matrix.start }} --end ${{ matrix.end }} --out sol15m_${{ matrix.tag }} --workers 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol15m-${{ matrix.tag }}
          path: |
            sol15m_${{ matrix.tag }}/summary.json
            sol15m_${{ matrix.tag }}/trades.csv
            sol15m_${{ matrix.tag }}/inventory.csv
          if-no-files-found: warn
          retention-days: 7
