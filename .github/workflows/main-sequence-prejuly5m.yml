name: main-sequence-prejuly5m

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/prejuly_5m_multiasset.py'
      - 'main_sequence/prejuly_5m_causal_runner.py'
      - '.github/workflows/main-sequence-prejuly5m.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  freeze-prejuly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pandas pyarrow numpy scipy duckdb huggingface_hub
      - name: Syntax gate
        run: |
          python -m py_compile main_sequence/prejuly_5m_multiasset.py
          python -m py_compile main_sequence/prejuly_5m_causal_runner.py
      - name: Train only on pre-July data and freeze
        run: |
          python main_sequence/prejuly_5m_causal_runner.py train \
            --out prejuly5m_train \
            --cache prejuly5m_cache
      - name: Show frozen contract
        if: always()
        run: |
          if [ -f prejuly5m_train/FROZEN_CONTRACT.json ]; then python -m json.tool prejuly5m_train/FROZEN_CONTRACT.json; fi
          if [ -f prejuly5m_train/train_summary.json ]; then python -m json.tool prejuly5m_train/train_summary.json; fi
      - name: Upload frozen train artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-prejuly5m-frozen
          path: prejuly5m_train/
          if-no-files-found: error
          retention-days: 7

  sealed-july-test:
    needs: freeze-prejuly
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pandas pyarrow numpy scipy duckdb huggingface_hub
      - name: Download frozen artifact
        uses: actions/download-artifact@v4
        with:
          name: main-sequence-prejuly5m-frozen
          path: frozen_prejuly5m
      - name: Verify sealed boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('frozen_prejuly5m/FROZEN_CONTRACT.json'))
          assert p['validation_end']=='2026-07-01'
          assert p['test_start']=='2026-07-01'
          assert p['test_end']=='2026-07-15'
          assert p['edge_floor']==0.03
          print('SEALED_CONTRACT_OK', p['dataset_revision'])
          PY
      - name: Open July 1-14 exactly once
        run: |
          python main_sequence/prejuly_5m_causal_runner.py test \
            --model-dir frozen_prejuly5m \
            --out prejuly5m_july_test \
            --cache july_test_cache
      - name: Show sealed result
        if: always()
        run: |
          if [ -f prejuly5m_july_test/SUMMARY.md ]; then cat prejuly5m_july_test/SUMMARY.md; fi
          if [ -f prejuly5m_july_test/test_summary.json ]; then python -m json.tool prejuly5m_july_test/test_summary.json; fi
      - name: Upload sealed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-prejuly5m-july-sealed
          path: prejuly5m_july_test/
          if-no-files-found: warn
          retention-days: 7
