name: main-sequence-v6-btc5m-tail-proxy-windows
on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - 'main_sequence/btc5m_tail_proxy_sweep.py'
      - '.github/workflows/main-sequence-v6-btc5m-tail-proxy-windows.yml'
  workflow_dispatch:
jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - run: python main_sequence/btc5m_tail_proxy_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc5m-tail-proxy-sweep
          path: btc5m_tail_proxy_out/
