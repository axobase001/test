name: main-sequence-mapping-audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/mapping_audit.py'
      - 'main_sequence/data_manifest.json'
      - '.github/workflows/main-sequence-mapping-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  mapping-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit stack
        run: python -m pip install huggingface_hub pandas pyarrow numpy
      - name: Audit pinned outcome/token mapping and raw fills
        run: python main_sequence/mapping_audit.py
      - name: Show result
        if: always()
        run: test ! -f mapping_audit/mapping_audit.json || python -m json.tool mapping_audit/mapping_audit.json
      - name: Upload mapping audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-mapping-audit
          path: mapping_audit/
          if-no-files-found: warn
          retention-days: 14
