name: main-sequence-pmxt-probe

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/pmxt_probe.py'
      - '.github/workflows/main-sequence-pmxt-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe stack
        run: python -m pip install duckdb requests
      - name: Probe one pmxt hour
        run: python main_sequence/pmxt_probe.py
