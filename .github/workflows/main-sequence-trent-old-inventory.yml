name: main-sequence-trent-old-inventory

on:
  push:
    branches: [ main-sequence-v1-trent-contract-20260816 ]
    paths:
      - 'research_tools/trent_old_inventory.py'
      - '.github/workflows/main-sequence-trent-old-inventory.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  inventory-old-trent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inventory stack
        run: python -m pip install huggingface_hub pandas
      - name: Inventory BTC15m endpoints and gaps
        run: python research_tools/trent_old_inventory.py
      - name: Show inventory
        if: always()
        run: test ! -f trent_old_inventory/inventory.json || python -m json.tool trent_old_inventory/inventory.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-trent-old-inventory
          path: trent_old_inventory/
          if-no-files-found: warn
          retention-days: 14
