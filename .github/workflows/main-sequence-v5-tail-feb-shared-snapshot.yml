name: main-sequence-v5-tail-feb-shared-snapshot

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - '.github/workflows/main-sequence-v5-tail-feb-shared-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Build single February world snapshot
        run: python main_sequence/v5_tail_shared_snapshot.py snapshot --start '2026-02-01' --end '2026-03-01' --out feb_snapshot --workers 12
      - uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v5-tail-feb-shared-snapshot
          path: |
            feb_snapshot/snapshot.pkl
            feb_snapshot/inventory.csv
            feb_snapshot/snapshot_meta.json
          retention-days: 14

  score:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          name: main-sequence-v5-tail-feb-shared-snapshot
          path: feb_snapshot
      - name: Score shard from identical snapshot
        run: python main_sequence/v5_tail_shared_snapshot.py score --snapshot feb_snapshot/snapshot.pkl --shard '${{ matrix.shard }}' --nshards 8 --out 'feb_score_${{ matrix.shard }}' --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-tail-feb-shared-score-${{ matrix.shard }}
          path: |
            feb_score_${{ matrix.shard }}/tail_candidates.csv
            feb_score_${{ matrix.shard }}/summary.json
            feb_score_${{ matrix.shard }}/retry_history.json
            feb_score_${{ matrix.shard }}/failures.json
          if-no-files-found: warn
          retention-days: 14
