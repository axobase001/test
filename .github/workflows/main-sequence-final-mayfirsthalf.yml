name: main-sequence-final-mayfirsthalf

on:
  pull_request:
    branches: [ main-sequence-dual-exit-93d-20260815 ]
    paths:
      - '.github/workflows/main-sequence-final-mayfirsthalf.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: '.'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: Score frozen causal May first half at low concurrency
        run: |
          python main_sequence/final_recent_replay.py score \
            --start '2026-05-01' \
            --end '2026-05-15' \
            --shard 'may_a' \
            --out 'may_a' \
            --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-final-may-a
          path: |
            may_a/dual_exit_records.csv
            may_a/market_inventory.csv
            may_a/summary.json
          if-no-files-found: warn
          retention-days: 14
