name: main-sequence-v1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'main_sequence/train_v1.py'
      - '.github/workflows/main-sequence-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  train-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'honest-backtest[parquet]==0.2.0' huggingface_hub requests scipy pandas pyarrow numpy
      - name: Download PM corpus
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='kinzikdza/polymarket-updown-microstructure', repo_type='dataset', local_dir='pm_data', allow_patterns=['parquet/*'])
          PY
      - name: Download frozen 3c replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          gh run download 31771161358 -n pm-structural-recalc-results -D prior
          test -f prior/results/records_structural_03c.csv
          test -f prior/results/summary.json
      - name: Train Main Sequence v1
        run: |
          PYTHONPATH=. python main_sequence/train_v1.py \
            --pm-dir pm_data/parquet \
            --records prior/results/records_structural_03c.csv \
            --prior-summary prior/results/summary.json \
            --out main_sequence_v1_results \
            --cache main_sequence_v1_cache \
            --start 2026-05-27 \
            --end 2026-06-24
      - name: Show result
        if: always()
        run: |
          if [ -f main_sequence_v1_results/SUMMARY.md ]; then cat main_sequence_v1_results/SUMMARY.md; fi
          if [ -f main_sequence_v1_results/summary.json ]; then python -m json.tool main_sequence_v1_results/summary.json; fi
      - name: Upload v1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-v1-results
          path: main_sequence_v1_results/
          if-no-files-found: warn
          retention-days: 7
