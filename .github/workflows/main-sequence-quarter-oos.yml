name: main-sequence-quarter-oos

on:
  pull_request:
    branches:
      - main-sequence-b-sealed-20260815
      - main
    paths:
      - 'main_sequence/prejuly_5m_official.py'
      - 'main_sequence/prejuly_5m_official_retryfix.py'
      - 'main_sequence/prejuly_5m_official_sealed.py'
      - 'main_sequence/prejuly_5m_official_stream.py'
      - 'main_sequence/prejuly_5m_official_final.py'
      - 'main_sequence/prejuly_5m_official_release.py'
      - 'main_sequence/quarterly_5m_official_release.py'
      - '.github/workflows/main-sequence-quarter-oos.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  freeze-quarter:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas scipy requests
      - name: Syntax gate
        run: |
          python -m py_compile main_sequence/prejuly_5m_official.py
          python -m py_compile main_sequence/prejuly_5m_official_retryfix.py
          python -m py_compile main_sequence/prejuly_5m_official_sealed.py
          python -m py_compile main_sequence/prejuly_5m_official_stream.py
          python -m py_compile main_sequence/prejuly_5m_official_final.py
          python -m py_compile main_sequence/prejuly_5m_official_release.py
          python -m py_compile main_sequence/quarterly_5m_official_release.py
      - name: Transport exact-equivalence gate
        run: python main_sequence/prejuly_5m_official_release.py equiv
      - name: Train Feb only and freeze quarter contract
        run: |
          python main_sequence/quarterly_5m_official_release.py train \
            --out main_sequence_quarter_train
      - name: Show frozen quarter contract
        if: always()
        run: |
          if [ -f main_sequence_quarter_train/FROZEN_CONTRACT.json ]; then python -m json.tool main_sequence_quarter_train/FROZEN_CONTRACT.json; fi
          if [ -f main_sequence_quarter_train/train_summary.json ]; then python -m json.tool main_sequence_quarter_train/train_summary.json; fi
      - name: Upload frozen quarter model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-quarter-frozen
          path: main_sequence_quarter_train/
          if-no-files-found: error
          retention-days: 14

  quarter-test:
    needs: freeze-quarter
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: mar
            start: '2026-03-01'
            end: '2026-04-01'
          - shard: apr
            start: '2026-04-01'
            end: '2026-05-01'
          - shard: may
            start: '2026-05-01'
            end: '2026-06-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas scipy requests
      - name: Download frozen model
        uses: actions/download-artifact@v4
        with:
          name: main-sequence-quarter-frozen
          path: frozen_quarter
      - name: Verify frozen contract before shard fetch
        run: |
          python - <<'PY'
          import json
          p=json.load(open('frozen_quarter/FROZEN_CONTRACT.json'))
          assert p['train']==['2026-02-01','2026-02-22']
          assert p['validation']==['2026-02-22','2026-03-01']
          assert p['sealed_test']==['2026-03-01','2026-06-01']
          assert p['assets']==['BTC','ETH','SOL','XRP']
          assert p['decision_s2c']==60
          assert p['edge_floor']==0.03
          assert p['limit_slip']==0.02
          assert p['tape_seconds']==5
          assert p['residual_bound']==0.50
          assert p['hard_anchor'].startswith('finance_p: causal Binance')
          ec=p['evaluation_contract']
          assert ec['quarter_days']==92
          assert ec['primary_probability_comparator']=='finance_p hard anchor'
          assert '7-day moving-block' in ec['probability_gate']
          assert '7-day moving-block' in ec['execution_gate']
          print('QUARTER_CONTRACT_OK')
          PY
      - name: Run frozen quarter shard
        run: |
          python main_sequence/quarterly_5m_official_release.py test \
            --model-dir frozen_quarter \
            --out "quarter_${{ matrix.shard }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --shard-name "${{ matrix.shard }}"
      - name: Show shard summary
        if: always()
        run: |
          if [ -f "quarter_${{ matrix.shard }}/test_summary.json" ]; then python -m json.tool "quarter_${{ matrix.shard }}/test_summary.json"; fi
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-quarter-${{ matrix.shard }}
          path: quarter_${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate-quarter:
    needs: quarter-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas scipy requests
      - name: Download all quarter shards
        uses: actions/download-artifact@v4
        with:
          pattern: main-sequence-quarter-*
          path: quarter_shards
      - name: Aggregate 92-day OOS statistics
        run: |
          python main_sequence/quarterly_5m_official_release.py aggregate \
            --shard-root quarter_shards \
            --out main_sequence_quarter_aggregate
      - name: Show quarter result
        if: always()
        run: |
          if [ -f main_sequence_quarter_aggregate/SUMMARY.md ]; then cat main_sequence_quarter_aggregate/SUMMARY.md; fi
          if [ -f main_sequence_quarter_aggregate/quarter_summary.json ]; then python -m json.tool main_sequence_quarter_aggregate/quarter_summary.json; fi
      - name: Upload quarter aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-quarter-aggregate
          path: main_sequence_quarter_aggregate/
          if-no-files-found: warn
          retention-days: 14
