name: main-sequence-trent-v1-golden-pilot

on:
  push:
    branches: [ main-sequence-v1-trent-contract-20260816 ]
    paths:
      - 'main_sequence/trent_v1_golden_pilot.py'
      - '.github/workflows/main-sequence-trent-v1-golden-pilot.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  march14-eight-episode-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen replay stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'honest-backtest[parquet]==0.2.0' huggingface_hub requests scipy pandas pyarrow numpy
      - name: Download original frozen Main Sequence v1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_v1
          gh run download 31786389773 -n main-sequence-v1-results -D frozen_v1
          test -f frozen_v1/main_sequence_v1.pt
          test -f frozen_v1/scaler.npz
      - name: Run Trent feature/inference golden pilot
        run: |
          PYTHONPATH=. python main_sequence/trent_v1_golden_pilot.py \
            --model-dir frozen_v1 \
            --out trent_v1_golden \
            --cache trent_v1_golden_cache \
            --day 2026-03-14 \
            --episodes 8
      - name: Show pilot
        if: always()
        run: |
          test ! -f trent_v1_golden/summary.json || python -m json.tool trent_v1_golden/summary.json
          test ! -f trent_v1_golden/trent_v1_golden_rows.csv || head -20 trent_v1_golden/trent_v1_golden_rows.csv
      - name: Upload pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-trent-v1-golden-pilot
          path: trent_v1_golden/
          if-no-files-found: warn
          retention-days: 14
