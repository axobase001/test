name: main-sequence-clockfixed-strict

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pm_structural/time_units.py'
      - 'pm_structural/obadiaha_strict_clockfixed.py'
      - 'pm_structural/oracle_direction_audit.py'
      - '.github/workflows/main-sequence-clockfixed-strict.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  march-clockfixed-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict replay stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'honest-backtest[parquet]==0.2.0' huggingface_hub requests scipy pandas pyarrow numpy
      - name: Run corrected March structural replay
        run: |
          PYTHONPATH=. python pm_structural/obadiaha_strict_clockfixed.py \
            --out march_clockfixed \
            --cache march_clockfixed_cache \
            --start 2026-03-02 \
            --end 2026-03-18 \
            --threshold 0.03 \
            --latency-ms 1000 \
            --tape-window-ms 15000 \
            --base-stake 5
      - name: Audit settlement oracle direction
        run: |
          PYTHONPATH=. python pm_structural/oracle_direction_audit.py \
            --fills march_clockfixed/fills_strict_coarse.csv \
            --out march_clockfixed/oracle_direction \
            --cache march_clockfixed/oracle_direction_cache \
            --start 2026-03-02 \
            --end 2026-03-18
      - name: Replay causal bankroll with audited capacity gates
        run: |
          python main_sequence/bankroll.py \
            --fills march_clockfixed/fills_strict_coarse.csv \
            --out march_clockfixed/bankroll \
            --initial 50 --base-trade 5 --single-cap 100 --market-cap 200
      - name: Show corrected March results
        if: always()
        run: |
          test ! -f march_clockfixed/clock_summary.json || python -m json.tool march_clockfixed/clock_summary.json
          test ! -f march_clockfixed/summary.json || python -m json.tool march_clockfixed/summary.json
          test ! -f march_clockfixed/oracle_direction/summary.json || python -m json.tool march_clockfixed/oracle_direction/summary.json
          test ! -f march_clockfixed/bankroll/bankroll_summary.json || python -m json.tool march_clockfixed/bankroll/bankroll_summary.json
      - name: Upload corrected March strict replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-sequence-march-clockfixed-strict
          path: march_clockfixed/
          if-no-files-found: warn
          retention-days: 14
