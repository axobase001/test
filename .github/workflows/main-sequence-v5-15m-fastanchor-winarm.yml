name: main-sequence-v5-15m-fastanchor-winarm

on:
  push:
    branches: [main-sequence-v5-symmetric-stop-1h-20260816]
    paths:
      - '.github/workflows/main-sequence-v5-15m-fastanchor-winarm.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  score:
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { shard: feb_b, start: "2026-02-15", end: "2026-03-01" }
          - { shard: mar_a, start: "2026-03-01", end: "2026-03-16" }
          - { shard: mar_b, start: "2026-03-16", end: "2026-04-01" }
          - { shard: apr_a, start: "2026-04-01", end: "2026-04-16" }
          - { shard: apr_b, start: "2026-04-16", end: "2026-05-01" }
          - { shard: may_a, start: "2026-05-01", end: "2026-05-15" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install "honest-backtest[parquet]==0.2.0" requests scipy pandas pyarrow numpy
      - name: Syntax gate
        run: python -m py_compile main_sequence/v5_15m_tail_fastanchor.py main_sequence/v5_15m_tail_only_fast.py
      - name: Score bridge with frozen logic and wider Deribit transport
        run: python main_sequence/v5_15m_tail_fastanchor.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --shard "${{ matrix.shard }}" --out "fast_${{ matrix.shard }}" --workers 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-sequence-v5-15m-fastanchor-${{ matrix.shard }}
          path: |
            fast_${{ matrix.shard }}/tail_tiered_records.csv
            fast_${{ matrix.shard }}/market_inventory.csv
            fast_${{ matrix.shard }}/summary.json
            fast_${{ matrix.shard }}/mapping_failures.csv
            fast_${{ matrix.shard }}/failures.json
          if-no-files-found: warn
          retention-days: 14
